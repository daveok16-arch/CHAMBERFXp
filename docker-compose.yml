services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ENGINE_URL: http://engine:8800
      DATABASE_URL: postgres://chamberfx:chamberfx@db:5432/chamberfx
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-token}
    depends_on:
      - engine
      - db
      - redis
    volumes:
      - signal_data:/app/data

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      ENGINE_PORT: 8800
      DATABASE_URL: postgres://chamberfx:chamberfx@db:5432/chamberfx
    depends_on:
      - db
    volumes:
      - model_data:/app/engine/models

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chamberfx
      POSTGRES_PASSWORD: chamberfx
      POSTGRES_DB: chamberfx
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  signal_data:
  model_data:
  pg_data: